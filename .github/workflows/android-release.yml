name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

          node <<'NODE'
          const { version } = require("./package.json");
          const tag = process.env.RELEASE_TAG;

          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Release tag "${tag}" must use vMAJOR.MINOR.PATCH format.`);
          }
          if (tag.slice(1) !== version) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}.`);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools,platforms;android-37,build-tools;37.0.0,ndk;27.1.12297006

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Production releases require all four Android signing secrets."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/quick-control-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./android/gradlew -p android :app:assembleRelease --stacktrace

      - name: Name release APK
        id: apk
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          apk_name="quick-control-${RELEASE_TAG}-${timestamp}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-control-${{ github.ref_name }}-${{ steps.apk.outputs.timestamp }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Quick Control ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
