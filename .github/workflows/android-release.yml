name: Build and Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      apk_name: ${{ steps.apk.outputs.apk_name }}
      timestamp: ${{ steps.apk.outputs.timestamp }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm release branch
        id: base
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Production releases must run from main."
              exit 1
            fi
          else
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release tags must point to a commit on main."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Prepare next release version
        id: version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release.js "$RELEASE_BUMP" --prepare >> "$GITHUB_OUTPUT"

      - name: Validate existing release tag
        id: existing-version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.js "$RELEASE_TAG" --existing-tag >> "$GITHUB_OUTPUT"

      - name: Check release tag is unused
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Release tag $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Production releases require all four Android signing secrets."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/quick-control-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./android/gradlew -p android :app:assembleRelease --stacktrace

      - name: Name release APK
        id: apk
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.existing-version.outputs.tag }}
        run: |
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          apk_name="quick-control-${RELEASE_TAG}-${timestamp}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Create version commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error::main changed during the release build. Run the release again against the latest main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android/app/build.gradle ios/VolumeController.xcodeproj/project.pbxproj
          git commit -m "chore(release): ${RELEASE_TAG}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git tag -a "$RELEASE_TAG" -m "Quick Control ${RELEASE_TAG}"
          git push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-control-${{ steps.version.outputs.tag || steps.existing-version.outputs.tag }}-${{ steps.apk.outputs.timestamp }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag || steps.existing-version.outputs.tag }}
          name: Quick Control ${{ steps.version.outputs.tag || steps.existing-version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
